services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: kpi-backend
    # Override the Dockerfile's default CMD to drop --proxy-headers/
    # --forwarded-allow-ips (otherwise identical: same module/host/port, no
    # --reload here either way). This compose file publishes 8000 straight to
    # the host with NO reverse proxy in front, so unlike the VM (Caddy) and
    # Render (their edge), there's no proxy hop here needing the
    # redirect-scheme fix — and trusting forwarded headers would let any LAN
    # client reaching this port spoof X-Forwarded-For, which uvicorn's
    # ProxyHeadersMiddleware would then use to overwrite scope["client"],
    # poisoning request.client.host in the auth audit log
    # (backend/routes/auth.py LOGIN_FAILED/SUCCESS entries). uvicorn's own
    # default (proxy_headers=True, forwarded_allow_ips="127.0.0.1") is safe
    # here too — Docker's port-publish NAT means a real client's peer IP is
    # never 127.0.0.1 — but omitting the flags entirely states the intent
    # explicitly rather than relying on that default.
    command: ["python", "-m", "uvicorn", "backend.main:app", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "8000:8000"
    environment:
      # Database configuration
      - DATABASE_URL=sqlite:///./database/kpi_platform.db
      # Authentication
      - SECRET_KEY=${SECRET_KEY:?Set SECRET_KEY in .env or environment}
      - ALGORITHM=HS256
      - ACCESS_TOKEN_EXPIRE_MINUTES=30
      # CORS
      - CORS_ORIGINS=http://localhost:3000,http://localhost:80,http://frontend:80
      # Logging
      - DEBUG=false
      - LOG_LEVEL=INFO
      # Demo mode (set to true to seed demo data on startup)
      - DEMO_MODE=${DEMO_MODE:-false}
      # Database initialization (set to true to run migrations on startup)
      - RUN_MIGRATIONS=${RUN_MIGRATIONS:-true}
      # The entrypoint (RUN_MIGRATIONS) owns migrations here — runs once before
      # workers start — so disable the redundant in-process startup migration.
      - RUN_MIGRATIONS_ON_STARTUP=false
    volumes:
      - ./database:/app/database
      - ./uploads:/app/uploads
      - ./reports:/app/reports
      - ./logs:/app/logs
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    networks:
      - kpi-network

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      target: development
    container_name: kpi-frontend
    ports:
      - "3000:3000"
    environment:
      - VITE_API_URL=http://localhost:8000
      # Demo mode (set to true to show the self-registration button on Login;
      # mirrors backend's DEMO_MODE, which gates the endpoint it calls)
      - VITE_DEMO_MODE=${VITE_DEMO_MODE:-false}
    depends_on:
      backend:
        condition: service_healthy
    volumes:
      - ./frontend:/workspace/frontend
      - ./docs/user-guide:/workspace/docs/user-guide:ro
      - /workspace/frontend/node_modules
    restart: unless-stopped
    networks:
      - kpi-network

  # Production frontend with nginx (use --profile production)
  frontend-prod:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      target: production
      args:
        VITE_API_URL: /api
    container_name: kpi-frontend-prod
    ports:
      - "80:80"
    environment:
      - BACKEND_URL=http://backend:8000
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - kpi-network
    profiles:
      - production

# Services above use bind mounts (./database, ./uploads, etc.) — no named volumes needed
networks:
  kpi-network:
    name: kpi-network
    driver: bridge
