repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
        args: ['--maxkb=500']

  - repo: https://github.com/psf/black
    rev: 26.5.1
    hooks:
      - id: black
        files: ^backend/
        language_version: python3.11

  - repo: https://github.com/pycqa/flake8
    rev: 7.3.0
    hooks:
      - id: flake8
        files: ^backend/
        additional_dependencies: []

  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        args: ['--baseline', '.secrets.baseline']
        exclude: package-lock\.json$

  # mypy as a local system hook rather than mirrors-mypy. The mirrors-
  # mypy hook invokes mypy file-by-file on the staged paths, which
  # collapses our `namespace_packages = true` cross-module resolution
  # and emits cascading false positives like `backend.database has no
  # attribute Base`. Running `mypy backend` once per commit (whole
  # package) matches CI and the local dev workflow exactly.
  - repo: local
    hooks:
      - id: mypy
        name: mypy (backend, whole-package)
        # backend/.venv explicitly, NEVER bare `python`. On a machine with
        # Anaconda first on PATH, `python -m mypy` resolved to Anaconda's mypy,
        # which reported "No issues found" for a file the repo's pinned mypy
        # 2.1.0 rejects outright — so this hook reported PASSED on every commit
        # while CI's `backend-tests` failed on the same file. A gate that runs a
        # different tool than CI is not a gate.
        #
        # Missing venv fails loudly here rather than silently falling back to
        # whatever `python` happens to be, which is the failure mode above.
        entry: bash -c 'test -x backend/.venv/bin/python || { echo "backend/.venv/bin/python not found - create the venv so this hook runs the same mypy as CI"; exit 1; }; exec backend/.venv/bin/python -m mypy backend'
        language: system
        # Trigger on any backend .py change but pass no filenames — the
        # entry runs the whole-package check itself.
        files: ^backend/.*\.py$
        pass_filenames: false

  - repo: https://github.com/PyCQA/bandit
    rev: '1.9.4'
    hooks:
      - id: bandit
        args: [-ll, --exclude, ./tests, -q]

  - repo: local
    hooks:
      - id: eslint
        name: eslint
        entry: bash -c 'cd frontend && npx eslint --ext .vue,.js,.jsx,.cjs,.mjs --no-fix'
        language: system
        files: ^frontend/src/.*\.(vue|js|jsx|cjs|mjs)$
        pass_filenames: false

      # vue-tsc whole-project type-check. JS files are not in the
      # check graph (allowJs is off and ambient .d.ts files cover JS
      # imports), so the gate only enforces .ts / .vue strict types.
      - id: vue-tsc
        name: vue-tsc (frontend, whole-project)
        entry: bash -c 'cd frontend && npx vue-tsc --noEmit'
        language: system
        files: ^frontend/src/.*\.(ts|tsx|vue)$
        pass_filenames: false

      # NOTE: Full frontend build verification (npm run build) is intentionally
      # NOT included as a pre-commit hook because it takes 30-60s per commit.
      # Build verification is enforced in CI (ci.yml frontend-lint-and-tests job)
      # which runs `npm run build` BEFORE tests as the first quality gate.
      # Enable branch protection to require CI to pass before merging to main.
